[workspace]
members = ["tedious-rs", "orbitsql-ui/src-tauri"]
default-members = ["tedious-rs"]
exclude = ["tedious-node"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "0.0.1-alpha"

[workspace.dependencies]
aes = "0.8"
argon2 = "0.5"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
cbc = "0.1"
cipher = "0.4"
encoding_rs = "0.8"
futures-util = "0.3.33"
gethostname = "1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native", "windows-native", "linux-native-sync-persistent"] }
hmac = "0.12"
md-5 = "0.10"
md4 = "0.11"
native-tls = "0.2"
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls-ring", "postgres", "mysql", "chrono", "json", "uuid"] }
tedious-rs = { path = "tedious-rs" }
socket2 = "0.6"
tauri = "2.11.5"
tauri-build = "2.6.3"
tauri-plugin-store = "2.4.4"
tokio = { version = "1", features = ["io-util", "net", "time", "macros", "rt-multi-thread", "sync", "process", "fs"] }
tokio-native-tls = "0.3"
tokio-rustls = "0.26"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
tempfile = "3"
yore = "2.1.1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
